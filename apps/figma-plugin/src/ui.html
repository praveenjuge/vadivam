<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vadivam Icons</title>
    <style>/* INJECT_UI_STYLES */</style>
  </head>
  <body>
    <!-- INJECT_SPRITE -->
    <main>
      <div class="search-wrap">
        <input
          id="search"
          type="search"
          placeholder="Search icons…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search Vadivam icons"
        />
        <div class="style-switch" role="group" aria-label="Icon style">
          <button type="button" data-style="outline" aria-pressed="true" aria-label="Outline" title="Outline">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5" /></svg>
          </button>
          <button type="button" data-style="solid" aria-pressed="false" aria-label="Solid" title="Solid">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><rect x="2" y="2" width="20" height="20" rx="6" /></svg>
          </button>
        </div>
        <select id="category" aria-label="Filter by category">
          <option value="">All</option>
        </select>
      </div>
      <div id="lucide-bar" role="status" hidden>
        <span id="lucide-message"></span>
        <button id="lucide-swap" type="button">Swap to Vadivam</button>
      </div>
      <div id="results" role="grid" aria-label="Vadivam icons"></div>
    </main>
    <dialog id="confirm">
      <form method="dialog">
        <p id="confirm-message"></p>
        <button value="cancel">Cancel</button>
        <button value="confirm" class="primary">Replace</button>
      </form>
    </dialog>
    <script>/* INJECT_UI_SCRIPT */</script>
  </body>
</html>
