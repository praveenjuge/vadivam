name: Icons & Auto Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

concurrency:
  group: icons-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  optimize-and-release:
    runs-on: ubuntu-latest
    # Skip the workflow's own bot commits so we don't loop.
    if: |
      github.event_name == 'pull_request' ||
      (!startsWith(github.event.head_commit.message, 'chore(icons):') &&
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # RELEASE_TOKEN is a PAT (or GitHub App token) with contents:write.
          # It is required for the tag push to trigger release.yml.
          # Without it we fall back to GITHUB_TOKEN, which still lets the
          # workflow commit and tag, but release.yml will not be triggered.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Flutter and Compose packages build with their own toolchains.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 9.8.2

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install Chromium
        if: github.event_name == 'push'
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Cache integration app dependencies
        if: github.event_name == 'push'
        uses: actions/cache@v6
        with:
          path: |
            tests/integration/*/node_modules
            tests/integration/nextjs/.next/cache
          key: integration-${{ runner.os }}-${{ hashFiles('tests/integration/*/bun.lock') }}
          restore-keys: |
            integration-${{ runner.os }}-

      - name: Optimize icons
        run: bun run icons:optimize

      - name: Check icons
        # Checking names against Lucide reads the GitHub API; anonymous calls
        # from shared runners get rate-limited.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run icons:check

      - name: Render preview
        run: bun run icons:preview

      - name: Render OG image
        run: bun run icons:og

      - name: Configure git
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit normalized icons
        if: github.event_name == 'push'
        id: normalize
        run: |
          if [ -n "$(git status --porcelain icons icons-solid README.md apps/docs/docs/index.mdx "apps/docs/docs/(icons)/03-categories.mdx" apps/docs/public/preview.png apps/docs/public/og.png)" ]; then
            git add icons icons-solid README.md apps/docs/docs/index.mdx "apps/docs/docs/(icons)/03-categories.mdx" apps/docs/public/preview.png apps/docs/public/og.png
            git commit -m "chore(icons): normalize via icons:optimize"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect releasable changes since the last release
        if: github.event_name == 'push'
        id: changes
        run: |
          # Compare against the last release tag, not just this push, so a
          # release run that failed is picked up again by the next push.
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude 'v*-*' HEAD 2>/dev/null || true)
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD^"
            fi
          fi
          if bun scripts/release-changes.mjs "$base" HEAD; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No package-producing inputs changed since $base; skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump versions
        if: github.event_name == 'push' && steps.changes.outputs.changed == 'true'
        id: bump
        run: |
          version=$(bun scripts/bump-version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git add package.json packages/*/package.json packages/vadivam-mcp/server.json apps/figma-plugin/package.json README.md packages/*/README.md packages/vadivam-flutter/pubspec.yaml packages/vadivam-compose/gradle.properties
          git commit -m "chore(release): v$version"

      # The docs build reads the changelog from GitHub Releases. Anonymous API
      # calls from shared runners get rate-limited, which drops the changelog
      # and fails the SEO tests, so authenticate them with the job token.
      - name: Test core
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run test:core

      - name: Test exact release commit
        if: github.event_name == 'push'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run test

      # The test suites above build every package first.
      - name: Test Flutter and Compose packages
        timeout-minutes: 15
        run: bun run test:native:built

      - name: Check generated inputs
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- icons icons-solid README.md apps/docs/docs/index.mdx "apps/docs/docs/(icons)/03-categories.mdx" apps/docs/public/preview.png apps/docs/public/og.png scripts/font-codepoints.json

      - name: Push tested commits
        if: github.event_name == 'push' && (steps.normalize.outputs.committed == 'true' || steps.changes.outputs.changed == 'true')
        run: git push origin "HEAD:${GITHUB_REF#refs/heads/}"

      - name: Record exact commit test status
        if: github.event_name == 'push' && steps.changes.outputs.changed == 'true'
        env:
          # RELEASE_TOKEN is needed for tag-triggered workflows, but may not
          # have commit-status scope. The job token has statuses:write above.
          GH_TOKEN: ${{ github.token }}
        run: |
          tested_sha=$(git rev-parse HEAD)
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$tested_sha" \
            -f state=success \
            -f context=vadivam/full-test \
            -f description="Full test suite passed for this release commit" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Push tested release tag
        if: github.event_name == 'push' && steps.changes.outputs.changed == 'true'
        run: |
          git tag -a "v${{ steps.bump.outputs.version }}" -m "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

  integration-matrix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        include:
          - shard: react-web
            apps: static nextjs tanstack-start vite-react
            cache_paths: |
              tests/integration/static/node_modules
              tests/integration/nextjs/node_modules
              tests/integration/nextjs/.next/cache
              tests/integration/tanstack-start/node_modules
              tests/integration/vite-react/node_modules
          - shard: native-and-ui
            apps: expo vue svelte solid
            cache_paths: |
              tests/integration/expo/node_modules
              tests/integration/vue/node_modules
              tests/integration/svelte/node_modules
              tests/integration/solid/node_modules
          - shard: compiled-web
            apps: angular astro preact qwik lit
            cache_paths: |
              tests/integration/angular/node_modules
              tests/integration/astro/node_modules
              tests/integration/preact/node_modules
              tests/integration/qwik/node_modules
              tests/integration/lit/node_modules
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore integration dependencies
        uses: actions/cache@v6
        with:
          path: ${{ matrix.cache_paths }}
          key: integration-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('tests/integration/*/bun.lock') }}
          restore-keys: |
            integration-${{ runner.os }}-${{ matrix.shard }}-

      - name: Install Chromium headless shell
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Build packages
        run: bun run icons:build

      - name: Test integration shard
        timeout-minutes: 10
        run: bun scripts/integration.mjs ${{ matrix.apps }}

  # The single required status check for pull requests. Branch rules point at
  # this job so matrix renames never leave a required check waiting forever.
  pr-checks:
    if: always() && github.event_name == 'pull_request'
    needs: [optimize-and-release, integration-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Require every pull request job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job finished with: $result"
              exit 1
            fi
          done
