name: Icons & Auto Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

concurrency:
  group: icons-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  optimize-and-release:
    runs-on: ubuntu-latest
    # Skip the workflow's own bot commits so we don't loop.
    if: |
      github.event_name == 'pull_request' ||
      (!startsWith(github.event.head_commit.message, 'chore(icons):') &&
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # RELEASE_TOKEN is a PAT (or GitHub App token) with contents:write.
          # It is required for the tag push to trigger release.yml.
          # Without it we fall back to GITHUB_TOKEN, which still lets the
          # workflow commit and tag, but release.yml will not be triggered.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        if: github.event_name == 'push'
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Cache integration app dependencies
        if: github.event_name == 'push'
        uses: actions/cache@v6
        with:
          path: |
            tests/integration/*/node_modules
            tests/integration/nextjs/.next/cache
          key: integration-${{ runner.os }}-${{ hashFiles('tests/integration/*/bun.lock') }}
          restore-keys: |
            integration-${{ runner.os }}-

      - name: Optimize icons
        run: bun run icons:optimize

      - name: Check icons
        run: bun run icons:check

      - name: Render preview
        run: bun run icons:preview

      - name: Render OG image
        run: bun run icons:og

      - name: Configure git
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit normalized icons
        if: github.event_name == 'push'
        id: normalize
        run: |
          if [ -n "$(git status --porcelain icons README.md apps/docs/docs/index.md apps/docs/public/preview.png apps/docs/public/og.png)" ]; then
            git add icons README.md apps/docs/docs/index.md apps/docs/public/preview.png apps/docs/public/og.png
            git commit -m "chore(icons): normalize via icons:optimize"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect releasable changes in this push
        if: github.event_name == 'push'
        id: changes
        run: |
          base="${{ github.event.before }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          fi
          if bun scripts/release-changes.mjs "$base" HEAD; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No package-producing inputs changed in this push; skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump versions
        if: github.event_name == 'push' && steps.changes.outputs.changed == 'true'
        id: bump
        run: |
          version=$(bun scripts/bump-version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git add package.json packages/*/package.json apps/figma-plugin/package.json README.md packages/*/README.md
          git commit -m "chore(release): v$version"

      - name: Test core
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        run: bun run test:core

      - name: Test exact release commit
        if: github.event_name == 'push'
        timeout-minutes: 15
        run: bun run test

      - name: Check generated inputs
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- icons README.md apps/docs/docs/index.md apps/docs/public/preview.png apps/docs/public/og.png scripts/font-codepoints.json

      - name: Push tested commits
        if: github.event_name == 'push' && (steps.normalize.outputs.committed == 'true' || steps.changes.outputs.changed == 'true')
        run: git push origin "HEAD:${GITHUB_REF#refs/heads/}"

      - name: Record exact commit test status
        if: github.event_name == 'push' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          tested_sha=$(git rev-parse HEAD)
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$tested_sha" \
            -f state=success \
            -f context=vadivam/full-test \
            -f description="Full test suite passed for this release commit" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Push tested release tag
        if: github.event_name == 'push' && steps.changes.outputs.changed == 'true'
        run: |
          git tag -a "v${{ steps.bump.outputs.version }}" -m "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

  integration-matrix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        include:
          - shard: react-web
            apps: static nextjs tanstack-start vite-react
            cache_paths: |
              tests/integration/static/node_modules
              tests/integration/nextjs/node_modules
              tests/integration/nextjs/.next/cache
              tests/integration/tanstack-start/node_modules
              tests/integration/vite-react/node_modules
          - shard: native-and-ui
            apps: expo vue svelte solid
            cache_paths: |
              tests/integration/expo/node_modules
              tests/integration/vue/node_modules
              tests/integration/svelte/node_modules
              tests/integration/solid/node_modules
          - shard: compiled-web
            apps: angular astro preact
            cache_paths: |
              tests/integration/angular/node_modules
              tests/integration/astro/node_modules
              tests/integration/preact/node_modules
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore integration dependencies
        uses: actions/cache@v6
        with:
          path: ${{ matrix.cache_paths }}
          key: integration-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('tests/integration/*/bun.lock') }}
          restore-keys: |
            integration-${{ runner.os }}-${{ matrix.shard }}-

      - name: Install Chromium headless shell
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Build packages
        run: bun run icons:build

      - name: Test integration shard
        timeout-minutes: 10
        run: bun scripts/integration.mjs ${{ matrix.apps }}
