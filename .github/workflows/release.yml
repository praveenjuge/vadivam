name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  statuses: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify exact commit test status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested_sha=$(git rev-parse HEAD)
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tested_sha/status" \
            --jq '[.statuses[] | select(.context == "vadivam/full-test")][0].state // ""')
          if [ "$state" != "success" ]; then
            echo "Missing successful vadivam/full-test status for $tested_sha" >&2
            exit 1
          fi

      - name: Validate release version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: bun run release:validate "$TAG_NAME"

      - name: Build tested release artifacts
        run: bun run icons:build && bun run figma-plugin:build

      - name: Publish and verify packages
        run: bun run release:publish

      - name: Package Figma plugin
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd apps/figma-plugin
          zip -q "../../vadivam-figma-${TAG_NAME}.zip" \
            manifest.json \
            dist/code.js \
            dist/ui.html \
            README.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "$TAG_NAME^" 2>/dev/null || true)
          bun scripts/release-notes.mjs "$previous_tag" "$TAG_NAME" > release-notes.md
          gh release create "$TAG_NAME" "vadivam-figma-${TAG_NAME}.zip#Vadivam Icons for Figma" --title "$TAG_NAME" --notes-file release-notes.md --generate-notes --verify-tag
